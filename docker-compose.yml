services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smartlab
      POSTGRES_USER: smartlab
      POSTGRES_PASSWORD: smartlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlab -d smartlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartlab
      DB_USER: smartlab
      DB_PASSWORD: smartlab
      JWT_SECRET: local-dev-secret-change-me-please-32bytes-min
      JWT_EXPIRATION_MINUTES: 480
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
